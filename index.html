<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REIP SCADA Demo</title><style>:root{--bg:#071018;--p:#0c1722;--t:#e7f0f7;--m:#8fa6b8;--r:#ff5252;--d:#53616c;--g:#39d989;--y:#ffd15c;--b:#63d8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,-apple-system,Segoe UI,Arial}header{padding:12px 16px;border-bottom:1px solid #263849;background:#09141e;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:18px;margin:0}.sub{font-size:11px;color:var(--m)}.sync{font-size:11px;padding:6px 9px;border-radius:999px;background:#173426;color:#92efb7}.sync.err{background:#421d20;color:#ff9999}.wrap{display:grid;grid-template-columns:minmax(720px,1fr) 360px;min-height:calc(100vh - 66px)}main,aside{padding:12px}aside{border-left:1px solid #263849;background:#09131d}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}button{background:#142638;color:var(--t);border:1px solid #31516b;border-radius:9px;padding:10px 13px;cursor:pointer;min-height:42px}.good{background:#133226}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:9px}.metric,.card{background:var(--p);border:1px solid #263849;border-radius:9px;padding:10px}.metric b{display:block}.metric span{font-size:10px;color:var(--m)}.sc{overflow:auto;background:#000;border:1px solid #2c3a44;border-radius:9px}.sc svg{display:block;width:900px}.wire,.bus{fill:none}.wire{stroke-width:3}.bus{stroke-width:6}.live{stroke:var(--r)}.dead{stroke:var(--d)}.br{cursor:pointer}.br rect{stroke:#ffd0d0;stroke-width:1;rx:3}.br.closed rect{fill:var(--r)}.br.open rect{fill:#26333e}.br.rec rect{stroke:var(--g)!important;stroke-width:3!important;filter:drop-shadow(0 0 5px var(--g))}.br text{fill:#fff;font-size:10px;font-weight:700;pointer-events:none}.source{fill:#0c1d28;stroke:#7bcfff}.lbl{fill:#dce7f0;font-size:11px}.small{fill:#9eb0bf;font-size:9px}.load{fill:#151515;stroke:#eee}.card{margin-bottom:10px}.card h3{font-size:12px;color:#aec3d4;margin:0 0 8px}.ai{border-left:4px solid var(--b);background:#0e2330;padding:9px;border-radius:6px;font-size:12px;line-height:1.45}.steps{font-size:12px;padding-left:20px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #182a38;padding:6px 0;font-size:12px}.pill{font-size:10px;font-weight:700;padding:2px 6px;border-radius:99px}.ok{background:#153a29;color:#83e6ad}.bad{background:#3b181c;color:#ff9797}.log{height:210px;overflow:auto;background:#050b10;border:1px solid #1c2d3a;border-radius:7px;padding:7px;font:11px ui-monospace,Consolas}.warn{color:#ffe18a}.yes{color:#7ce6aa}.maj{color:#ff7070}.inf{color:#9ccaff}@media(max-width:1000px){.wrap{display:block}aside{border-left:0;border-top:1px solid #263849}.metrics{grid-template-columns:1fr 1fr}.sc svg{width:900px}}</style></head><body><header><div><h1>REIP · SCADA / Kontrol Merkezi Demo</h1><div class="sub">Bu ekran komut üretir; REIP Field yalnızca görüntüler.</div></div><div id="cloud" class="sync">FIREBASE BAĞLANIYOR</div></header><div class="wrap"><main><div class="tools"><button class="good" onclick="applyAI()">✓ AI Önerisini Simüle Et</button><button onclick="resetSim()">↺ Reset</button></div><div class="metrics"><div class="metric"><b id="ma">—</b><span>TEİAŞ-A kablo</span></div><div class="metric"><b id="mb">—</b><span>TEİAŞ-B kablo</span></div><div class="metric"><b id="ba">—</b><span>Bara-A</span></div><div class="metric"><b id="bb">—</b><span>Bara-B</span></div></div><div class="sc"><svg viewBox="0 0 900 430"><rect x="50" y="35" width="220" height="55" class="source"/><text x="160" y="55" text-anchor="middle" class="lbl">TEİAŞ-A</text><g id="TA" class="br closed" onclick="toggle('TA')"><rect x="125" y="62" width="70" height="24"/><text x="137" y="78">ÇIKIŞ-A</text></g><rect x="630" y="35" width="220" height="55" class="source"/><text x="740" y="55" text-anchor="middle" class="lbl">TEİAŞ-B</text><g id="TB" class="br closed" onclick="toggle('TB')"><rect x="705" y="62" width="70" height="24"/><text x="717" y="78">ÇIKIŞ-B</text></g><line id="CA" x1="160" y1="86" x2="160" y2="130" class="wire live"/><line id="CB" x1="740" y1="86" x2="740" y2="130" class="wire live"/><g id="GA" class="br closed" onclick="toggle('GA')"><rect x="130" y="120" width="60" height="28"/><text x="138" y="138">GİRİŞ-A</text></g><g id="GB" class="br closed" onclick="toggle('GB')"><rect x="710" y="120" width="60" height="28"/><text x="718" y="138">GİRİŞ-B</text></g><line id="CAT" x1="160" y1="148" x2="160" y2="180" class="wire live"/><line id="CBT" x1="740" y1="148" x2="740" y2="180" class="wire live"/><line id="BA" x1="65" y1="190" x2="420" y2="190" class="bus live"/><line id="BB" x1="480" y1="190" x2="835" y2="190" class="bus live"/><text x="70" y="178" class="small">BARA-A</text><text x="790" y="178" class="small">BARA-B</text><g id="CO" class="br open" onclick="toggle('CO')"><rect x="430" y="176" width="50" height="28"/><text x="438" y="194">COUP</text></g><line id="WA1" x1="170" y1="190" x2="170" y2="285" class="wire live"/><g id="A1" class="br closed" onclick="toggle('A1')"><rect x="148" y="225" width="44" height="26"/><text x="154" y="242">AUX1</text></g><rect x="125" y="285" width="90" height="40" class="load"/><text x="142" y="309" class="lbl">SERVİS-1</text><line id="WC1" x1="300" y1="190" x2="300" y2="285" class="wire live"/><g id="C1" class="br closed" onclick="toggle('C1')"><rect x="278" y="225" width="44" height="26"/><text x="286" y="242">CER1</text></g><rect x="255" y="285" width="90" height="40" class="load"/><text x="273" y="309" class="lbl">CER TR-1</text><line id="WA2" x1="600" y1="190" x2="600" y2="285" class="wire live"/><g id="A2" class="br closed" onclick="toggle('A2')"><rect x="578" y="225" width="44" height="26"/><text x="584" y="242">AUX2</text></g><rect x="555" y="285" width="90" height="40" class="load"/><text x="572" y="309" class="lbl">SERVİS-2</text><line id="WC2" x1="730" y1="190" x2="730" y2="285" class="wire live"/><g id="C2" class="br closed" onclick="toggle('C2')"><rect x="708" y="225" width="44" height="26"/><text x="716" y="242">CER2</text></g><rect x="685" y="285" width="90" height="40" class="load"/><text x="703" y="309" class="lbl">CER TR-2</text><text x="55" y="375" class="lbl">SCADA değişiklikleri Firebase'e yayınlanır → REIP Field salt-okunur olarak görür.</text></svg></div></main><aside><div class="card"><h3>AI / Decision Support</h3><div id="ai" class="ai"></div><ol id="steps" class="steps"></ol></div><div class="card"><h3>Elektriksel Durum</h3><div id="status"></div></div><div class="card"><h3>Olay Akışı</h3><div id="log" class="log"></div></div></aside></div><script>const FB='https://reip-demo-default-rtdb.firebaseio.com/reip/state.json';const S={srcA:true,srcB:true,br:{TA:1,TB:1,GA:1,GB:1,CO:0,A1:1,C1:1,A2:1,C2:1},prevA:1,prevB:1,rec:null,event:'Sistem normal işletmede',version:0};const $=x=>document.getElementById(x),now=()=>new Date().toLocaleTimeString('tr-TR',{hour12:false});function lg(t,k='inf'){S.event=t;let d=document.createElement('div');d.className=k;d.textContent=now()+'  '+t;$('log').prepend(d)}function line(id,on){$(id).classList.toggle('live',!!on);$(id).classList.toggle('dead',!on)}function br(id){$(id).classList.toggle('closed',!!S.br[id]);$(id).classList.toggle('open',!S.br[id]);$(id).classList.remove('rec')}function state(){let ad=S.srcA&&S.br.GA,bd=S.srcB&&S.br.GB,a=ad,b=bd;if(S.br.CO&&(a||b)){a=1;b=1}if(S.prevA&&!a){['A1','C1'].forEach(x=>{if(S.br[x]){S.br[x]=0;lg(x+' otomatik AÇTI — Bara-A gerilimsiz','warn')}})}if(S.prevB&&!b){['A2','C2'].forEach(x=>{if(S.br[x]){S.br[x]=0;lg(x+' otomatik AÇTI — Bara-B gerilimsiz','warn')}})}S.prevA=a;S.prevB=b;return{ad,bd,a,b}}function payload(s){return{version:++S.version,updatedAt:new Date().toISOString(),updatedBy:'SCADA-DEMO',sourceA:!!S.srcA,sourceB:!!S.srcB,gridA:!!S.br.GA,gridB:!!S.br.GB,coupler:!!S.br.CO,aux1:!!S.br.A1,cer1:!!S.br.C1,aux2:!!S.br.A2,cer2:!!S.br.C2,baraA:!!s.a,baraB:!!s.b,event:S.event}}async function publish(s){let c=$('cloud');try{let r=await fetch(FB,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload(s))});if(!r.ok)throw new Error(r.status);c.textContent='● LIVE → FIREBASE';c.className='sync'}catch(e){c.textContent='FIREBASE YAZMA HATASI';c.className='sync err'}}function calc(send=true){let s=state();render(s);advise(s);if(send)publish(s)}function render(s){Object.keys(S.br).forEach(br);$('ma').textContent=S.srcA?'ENERJİLİ':'KAYIP';$('mb').textContent=S.srcB?'ENERJİLİ':'KAYIP';$('ba').textContent=s.a?'34.5 kV':'0 kV';$('bb').textContent=s.b?'34.5 kV':'0 kV';line('CA',S.srcA);line('CB',S.srcB);line('CAT',s.ad);line('CBT',s.bd);line('BA',s.a);line('BB',s.b);line('WA1',s.a&&S.br.A1);line('WC1',s.a&&S.br.C1);line('WA2',s.b&&S.br.A2);line('WC2',s.b&&S.br.C2);$('status').innerHTML=[['TEİAŞ-A',S.srcA],['TEİAŞ-B',S.srcB],['Bara-A',s.a],['Bara-B',s.b],['Kuplaj',S.br.CO],['AUX1',S.br.A1],['AUX2',S.br.A2],['CER1',S.br.C1],['CER2',S.br.C2]].map(r=>`<div class="row"><span>${r[0]}</span><span class="pill ${r[1]?'ok':'bad'}">${r[1]?'1':'0'}</span></div>`).join('')}function hi(id){$(id).classList.add('rec')}function advise(s){['CO','GA','GB','A1','A2','C1','C2'].forEach(x=>$(x).classList.remove('rec'));S.rec=null;let a=$('ai'),p=$('steps');p.innerHTML='';if(S.br.CO&&S.srcA&&!S.br.GA&&s.a){a.innerHTML='<b>TEİAŞ-A geri geldi.</b> Bara-A alternatif kaynaktan enerjili. Önce kuplajı aç.';S.rec='OPEN_CO_A';hi('CO');return}if(S.br.CO&&S.srcB&&!S.br.GB&&s.b){a.innerHTML='<b>TEİAŞ-B geri geldi.</b> Bara-B alternatif kaynaktan enerjili. Önce kuplajı aç.';S.rec='OPEN_CO_B';hi('CO');return}if(S.srcA&&!S.br.GA&&!s.a){a.innerHTML='<b>TEİAŞ-A hazır.</b> GİRİŞ-A kapatılması önerilir.';S.rec='CLOSE_GA';hi('GA');return}if(S.srcB&&!S.br.GB&&!s.b){a.innerHTML='<b>TEİAŞ-B hazır.</b> GİRİŞ-B kapatılması önerilir.';S.rec='CLOSE_GB';hi('GB');return}if(s.a&&!s.b&&!S.br.CO){a.innerHTML='<b>Bara-B enerjisiz.</b> Kuplaj üzerinden besleme önerilir.';S.rec='CO_B';hi('CO');return}if(s.b&&!s.a&&!S.br.CO){a.innerHTML='<b>Bara-A enerjisiz.</b> Kuplaj üzerinden besleme önerilir.';S.rec='CO_A';hi('CO');return}if(s.a&&s.b){for(let [id,n] of [['A1','AUX1'],['A2','AUX2'],['C1','CER1'],['C2','CER2']])if(!S.br[id]){a.innerHTML='<b>Yük restorasyonu:</b> sıradaki manuel öneri '+n;S.rec='MAN_'+id;hi(id);return}}if(!s.a&&!s.b){a.innerHTML='<b>Her iki bara enerjisiz.</b> Kaynak dönüşü bekleniyor.';return}a.innerHTML='<b>Normal işletme.</b> Ek manevra önerisi yok.'}function toggle(id){let s=state();if(id==='TA'||id==='TB'){let A=id==='TA',g=A?'GA':'GB';S.br[id]=!S.br[id];if(!S.br[id]){A?S.srcA=0:S.srcB=0;S.br[g]=0;lg(id+' AÇTI — ilgili giriş hücresi de açtı','maj')}else{A?S.srcA=1:S.srcB=1;lg(id+' KAPATILDI — giriş kablosu enerjilendi','yes')}calc();return}if(['A1','C1','A2','C2'].includes(id)&&!S.br[id]){let A=id==='A1'||id==='C1';if(A?!s.a:!s.b){lg('INTERLOCK — '+id+' kapatılamaz: bara enerjisiz','warn');calc();return}}if((id==='GA'||id==='GB')&&!S.br[id]){let A=id==='GA';if(A?!S.srcA:!S.srcB){lg('INTERLOCK — '+id+' kapatılamaz: TEİAŞ kablosu enerjisiz','warn');calc();return}if(A?s.a:s.b){lg('INTERLOCK — '+id+' kapatılamaz: bara zaten enerjili','warn');calc();return}}if(id==='CO'&&!S.br.CO&&((s.a&&s.b)||(!s.a&&!s.b))){lg('INTERLOCK — kuplaj yalnızca bir bara enerjiliyken kapanabilir','warn');calc();return}S.br[id]=!S.br[id];lg(id+' '+(S.br[id]?'KAPATILDI':'AÇILDI'),S.br[id]?'yes':'inf');calc()}function applyAI(){if(S.rec==='CO_A'||S.rec==='CO_B'){S.br.CO=1;lg('AI önerisi simüle edildi: kuplaj KAPALI','yes')}else if(S.rec==='OPEN_CO_A'||S.rec==='OPEN_CO_B'){S.br.CO=0;lg('AI önerisi simüle edildi: kuplaj AÇIK','yes')}else if(S.rec==='CLOSE_GA')return toggle('GA');else if(S.rec==='CLOSE_GB')return toggle('GB');else if(S.rec&&S.rec.startsWith('MAN_'))lg('AI yalnızca manuel yük devreye alma önerisi verdi','inf');else lg('Aktif AI önerisi yok','inf');calc()}function resetSim(){S.srcA=S.srcB=S.prevA=S.prevB=1;Object.assign(S.br,{TA:1,TB:1,GA:1,GB:1,CO:0,A1:1,C1:1,A2:1,C2:1});$('log').innerHTML='';lg('Sistem resetlendi','yes');calc()}lg('SCADA demo başlatıldı','yes');calc();</script></body></html>
